<div *carousel="let source from images; let ctrl=controller;let sourceUrl;let actionsAllowed=actionsAllowed">
  <h1>{{sourceUrl}}</h1>
  <div class="d-flex">
    <button (click)="ctrl.prev()" class="btn btn-danger" [disabled]="!actionsAllowed.prev">PREV</button>
    <img [src]="source" class="rounded" />
    <button (click)="ctrl.next()" class="btn btn-success" [disabled]="!actionsAllowed.next">NEXT</button>
  </div>
</div>>
